[project]
name = "ai-engineering-mentor"
version = "0.1.0"
description = "An AI Engineering Mentor built to explore agent engineering concepts."
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-genai",
    "openai",
    "python-dotenv",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"